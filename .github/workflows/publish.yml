name: Publish

# Publishing is driven by a GitHub release, so the tag, the notes and the
# published artifact always describe the same commit.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

  github-packages:
    name: GitHub Packages
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'

      - run: npm ci
      - run: npm run build

      # GitHub Packages requires the package name to carry the owner's scope,
      # so the name is scoped for this publish only — the npm registry keeps
      # the unscoped name.
      - name: Scope the package name for GitHub Packages
        run: npm pkg set name="@${{ github.repository_owner }}/sslcommerz-nestjs"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm registry
    runs-on: ubuntu-latest
    needs: verify
    # Skipped automatically until an NPM_TOKEN secret exists.
    if: ${{ vars.PUBLISH_TO_NPM == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
